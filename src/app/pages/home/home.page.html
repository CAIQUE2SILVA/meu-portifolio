<div>
  <app-nav></app-nav>

  <header id="inicio">
    <div>
      <div>
        <h1 class="hero-item">{{ 'hero.name' | t }}</h1>
        <h2 class="hero-item">{{ 'hero.role' | t }}</h2>
        <p class="hero-item" [innerHTML]="'hero.bio' | t"></p>
        <div class="hero-item">
          <a [routerLink]="['/home']" fragment="projetos">{{ 'hero.cta.projects' | t }}</a>
          <!-- Botão de currículo desabilitado temporariamente até atualização do PDF sem dados sensíveis
          <a href="assets/cv/Resume.pdf" target="_blank" rel="noopener noreferrer">{{ 'hero.cta.cv' | t }}</a>
          -->
          <a href="https://wa.me/5511956386749?text=Ol%C3%A1%2C%20vim%20pelo%20seu%20portf%C3%B3lio%21" target="_blank" rel="noopener noreferrer">
            {{ 'hero.cta.whatsapp' | t }}
          </a>
        </div>
      </div>
      <div class="hero-item">
        <span>
          <img src="assets/images/profile.png" [alt]="'hero.photo.alt' | t">
        </span>
      </div>
    </div>
  </header>

  <app-sobre></app-sobre>
  <app-skills></app-skills>
  <app-experiencia></app-experiencia>
  <app-projetos></app-projetos>
  <app-educacao></app-educacao>
  <app-footer></app-footer>
</div>

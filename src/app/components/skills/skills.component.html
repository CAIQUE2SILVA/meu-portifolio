<section id="skills">
  <div>
    <h2>Stack Tecnológica</h2>
    <div>
      @for (category of categories; track category.id) {
        <div>
          <h3>
            <span aria-hidden="true">{{ category.icon }}</span> {{ category.titleKey }}
          </h3>
          <div>
            @for (skill of category.skills; track skill) {
              <span>{{ skill }}</span>
            }
          </div>
        </div>
      }
    </div>
  </div>
</section>

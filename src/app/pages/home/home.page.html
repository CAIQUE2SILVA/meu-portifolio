<div>
  <app-nav></app-nav>

  <div class="scroll-progress" aria-hidden="true">
    <span class="scroll-progress-bar"></span>
  </div>

  <header id="inicio" class="hero">
    <span class="hero-aura" aria-hidden="true"></span>

    <div class="hero-grid">
      <div class="hero-copy">
        <p class="hero-eyebrow">
          <span class="hero-eyebrow-dot" aria-hidden="true"></span>
          {{ 'hero.eyebrow' | t }}
        </p>

        <h1 class="hero-name">{{ 'hero.name' | t }}</h1>
        <h2 class="hero-role">{{ 'hero.role' | t }}</h2>
        <p class="hero-bio" [innerHTML]="'hero.bio' | t"></p>

        <div class="hero-actions">
          <a class="hero-cta is-primary" data-magnetic="0.2" [routerLink]="['/home']" fragment="projetos">
            {{ 'hero.cta.projects' | t }}
          </a>
          <a class="hero-cta" data-magnetic="0.2" href="assets/cv/Resume.pdf" target="_blank" rel="noopener noreferrer">
            {{ 'hero.cta.cv' | t }}
          </a>
          <a
            class="hero-cta is-contrast"
            data-magnetic="0.2"
            href="https://wa.me/5511956386749?text=Ol%C3%A1%2C%20vim%20pelo%20seu%20portf%C3%B3lio%21"
            target="_blank"
            rel="noopener noreferrer"
          >
            {{ 'hero.cta.whatsapp' | t }}
          </a>
        </div>
      </div>

      <div class="hero-media">
        <span class="hero-media-frame">
          <img class="hero-photo" src="assets/images/profile.png" [alt]="'hero.photo.alt' | t">
        </span>
      </div>
    </div>

    <a class="hero-cue" [routerLink]="['/home']" fragment="sobre">
      <span class="hero-cue-line" aria-hidden="true"></span>
      {{ 'hero.scrollCue' | t }}
    </a>
  </header>

  <app-sobre></app-sobre>
  <app-skills></app-skills>
  <app-experiencia></app-experiencia>
  <app-projetos></app-projetos>
  <app-educacao></app-educacao>
  <app-footer></app-footer>
</div>
